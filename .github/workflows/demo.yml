name: Publish documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'demo/**', 'scripts/build-site.py', 'scripts/update-cli-reference.py', '.github/workflows/demo.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build documentation and demo
        run: python3 scripts/build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
