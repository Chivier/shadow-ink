[package]
name = "shadow-ink"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Resumable file transfer through terminal text and QR playback"
license = "MIT"
repository = "https://github.com/Chivier/shadow-ink"

[features]
default = ["receiver"]
receiver = ["dep:zxing-cpp", "dep:vt100", "dep:rusqlite", "dep:fs2"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
crossterm = "0.29"
ctrlc = { version = "3", features = ["termination"] }
hex = "0.4"
libc = "0.2"
fs2 = { version = "0.4", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
qrcodegen = "1.8"
rand = "0.8"
reed-solomon-erasure = { version = "=6.0.0", default-features = false, features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
vt100 = { version = "0.18", optional = true }
zstd = "0.13"
zxing-cpp = { version = "0.5.3", features = ["bundled"], optional = true }
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
